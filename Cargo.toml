[workspace]
members = ["pkg/core", "pkg/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Every third-party version lives here, so the two crates can never drift onto
# different copies of the same dependency. Members opt in with
# `foo.workspace = true`, adding only the features they need on top.
[workspace.dependencies]
slopcount_core = { path = "pkg/core" }

aho-corasick = "1.1.5"
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
gix = { version = "0.87.1", features = ["max-performance-safe"] }
globset = "0.4.20"
ignore = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = "1.53.1"
